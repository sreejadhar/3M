apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-ui
  namespace: datananite2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tech-ui
  template:
    metadata:
      labels:
        app: tech-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      containers:
      - name: tech-ui
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-tech:latest
        ports:
        - containerPort: 8006
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        volumeMounts:
        - name: shared-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8006
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: datananite2-shared-pvc
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: tech-ui-backendconfig
  namespace: datananite2
spec:
  # GCP's default backend-service timeout is 30s, which kills the Pipeline
  # Monitor's SSE stream (/api/sources/{id}/index-events) and any large file
  # upload well before either can finish. Long-running indexing jobs and
  # multi-hundred-MB uploads need much more headroom than that.
  timeoutSec: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: tech-ui-service
  namespace: datananite2
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default": "tech-ui-backendconfig"}'
spec:
  selector:
    app: tech-ui
  ports:
  - port: 8006
    targetPort: 8006
  type: ClusterIP
