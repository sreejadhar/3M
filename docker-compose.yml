services:

  # ── Agent API ─────────────────────────────────────────────────────────────────
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: metadata-agent-api:latest
    container_name: metadata-agent-api
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - reports_data:/data/reports
    environment:
      # Claude endpoint — set in .env or shell before running
      CLAUDE_API_KEY:  "${CLAUDE_API_KEY}"
      CLAUDE_BASE_URL: "${CLAUDE_BASE_URL:-https://api.anthropic.com}"
      DATA_DIR: /data/reports
      # Tune log verbosity: debug | info | warning
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      # timeout=4 ensures the check exits cleanly within the 5s docker timeout window.
      # start_period=90s: this image imports LangChain/LangGraph/pyodbc/pandas/rdflib
      # and installs ODBC drivers — cold-start on EC2 can take 60-90s.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - metadata-net

  # ── Ontology API ───────────────────────────────────────────────────────────────
  ontology-api:
    build:
      context: .
      dockerfile: Dockerfile.ontology
    image: metadata-ontology-api:latest
    container_name: metadata-ontology-api
    restart: unless-stopped
    ports:
      - "${ONTOLOGY_PORT:-8001}:8001"
    volumes:
      - reports_data:/data/reports
    environment:
      DATA_DIR: /data/reports
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Knowledge Graph API ────────────────────────────────────────────────────────
  kg-api:
    build:
      context: .
      dockerfile: Dockerfile.kg
    image: metadata-kg-api:latest
    container_name: metadata-kg-api
    restart: unless-stopped
    ports:
      - "${KG_PORT:-8002}:8002"
    environment:
      CLAUDE_API_KEY:  "${CLAUDE_API_KEY}"
      CLAUDE_BASE_URL: "${CLAUDE_BASE_URL:-https://api.anthropic.com}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Dialog with Data API ──────────────────────────────────────────────────
  dialog-api:
    build:
      context: .
      dockerfile: Dockerfile.dialog
    image: metadata-dialog-api:latest
    container_name: metadata-dialog-api
    restart: unless-stopped
    ports:
      - "${DIALOG_PORT:-8003}:8003"
    volumes:
      - reports_data:/data/reports
    environment:
      CLAUDE_API_KEY:  "${CLAUDE_API_KEY}"
      CLAUDE_BASE_URL: "${CLAUDE_BASE_URL:-https://api.anthropic.com}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      # dialog-api imports LangGraph + Anthropic — allow 60s on EC2
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - metadata-net

  # ── Conformity API ────────────────────────────────────────────────────────────
  conformity-api:
    build:
      context: .
      dockerfile: Dockerfile.conformity
    image: metadata-conformity-api:latest
    container_name: metadata-conformity-api
    restart: unless-stopped
    ports:
      - "${CONFORMITY_PORT:-8004}:8004"
    environment:
      CLAUDE_API_KEY:  "${CLAUDE_API_KEY}"
      CLAUDE_BASE_URL: "${CLAUDE_BASE_URL:-https://api.anthropic.com}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── DataChat Web UI (Orchestrator) ───────────────────────────────────────────
  chat-ui:
    build:
      context: .
      dockerfile: Dockerfile.chat
    image: metadata-chat-ui:latest
    container_name: metadata-chat-ui
    restart: unless-stopped
    ports:
      - "${CHAT_PORT:-8005}:8005"
    volumes:
      - metadata_catalog_data:/data
    environment:
      CLAUDE_API_KEY:  "${CLAUDE_API_KEY}"
      CLAUDE_BASE_URL: "${CLAUDE_BASE_URL:-https://api.anthropic.com}"
      # Internal Docker DNS — matches service names above
      METADATA_API_URL: "http://agent-api:8000"
      ONTOLOGY_API_URL: "http://ontology-api:8001"
      KG_API_URL:       "http://kg-api:8002"
      DIALOG_API_URL:   "http://dialog-api:8003"
      LOG_LEVEL:        "${LOG_LEVEL:-info}"
      METADATA_DB:      "/data/metadata.db"
    depends_on:
      agent-api:
        condition: service_healthy
      dialog-api:
        condition: service_healthy
      ontology-api:
        condition: service_started
      kg-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Streamlit UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: metadata-agent-ui:latest
    container_name: metadata-agent-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      # Must match service names above so Docker DNS resolves them
      AGENT_API_URL:       "http://agent-api:8000"
      ONTOLOGY_API_URL:    "http://ontology-api:8001"
      KG_API_URL:          "http://kg-api:8002"
      DIALOG_API_URL:      "http://dialog-api:8003"
      CONFORMITY_API_URL:  "http://conformity-api:8004"
    depends_on:
      agent-api:
        condition: service_healthy
      ontology-api:
        condition: service_started
      kg-api:
        condition: service_started
      dialog-api:
        condition: service_started
      conformity-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - metadata-net

  # ── Tech Workforce UI ────────────────────────────────────────────────────────
  tech-ui:
    build:
      context: .
      dockerfile: Dockerfile.tech
    image: metadata-tech-ui:latest
    container_name: metadata-tech-ui
    restart: unless-stopped
    ports:
      - "${TECH_PORT:-8006}:8006"
    environment:
      # Proxy target: the orchestrator/chat-ui service hosts all the APIs
      ORCHESTRATOR_URL: "http://chat-ui:8005"
      LOG_LEVEL:        "${LOG_LEVEL:-info}"
    depends_on:
      chat-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

# ── Named volume so reports persist across container restarts ─────────────────
volumes:
  reports_data:
    driver: local
  metadata_catalog_data:
    driver: local

# ── Internal network — UI reaches API via service name, not localhost ─────────
networks:
  metadata-net:
    driver: bridge
