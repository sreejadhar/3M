apiVersion: apps/v1
kind: Deployment
metadata:
  name: shacl-api
  namespace: datananite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shacl-api
  template:
    metadata:
      labels:
        app: shacl-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      containers:
      - name: shacl-api
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-shacl:latest
        ports:
        - containerPort: 8007
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8007
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shacl-api-service
  namespace: datananite
spec:
  selector:
    app: shacl-api
  ports:
  - port: 8007
    targetPort: 8007
  type: ClusterIP
