apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: datananite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "mkdir -p /data/reports && chmod -R 777 /data/reports && mkdir -p /data/appdata && chmod -R 777 /data/appdata"]
        volumeMounts:
        - name: shared-data
          mountPath: /data/reports
          subPath: reports
        - name: shared-data
          mountPath: /data/appdata
          subPath: appdata
      containers:
      - name: chat-ui
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-chat:latest
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        volumeMounts:
        - name: shared-data
          mountPath: /data/reports
          subPath: reports
        - name: shared-data
          mountPath: /data
          subPath: appdata
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: datananite-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui-service
  namespace: datananite
spec:
  selector:
    app: chat-ui
  ports:
  - port: 8005
    targetPort: 8005
  type: ClusterIP
