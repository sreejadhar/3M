services:

  # ── Agent API ─────────────────────────────────────────────────────────────────
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
      network: host   # lets apt-get use the host's DNS during build
    image: metadata-agent-api:latest
    container_name: metadata-agent-api
    restart: unless-stopped
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - reports_data:/data/reports
    environment:
      # Bedrock (llm_client.py assumes this role via STS — no API key needed).
      # ANTHROPIC_API_KEY is optional, for local-dev override only.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN: "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      # RDS PostgreSQL (metadata_catalog.py etc.) — credentials from Secrets
      # Manager at runtime, not from here. See pg_secrets.py.
      APP_ENV: "${APP_ENV:-production}"
      PG_SECRET_ID: "${PG_SECRET_ID:-datananite/rds/app-user}"
      PG_HOST: "${PG_HOST:-pg-rds-datananite-dev-001a.cuepp5apko9u.us-east-1.rds.amazonaws.com}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DATABASE: "${PG_DATABASE:-datananite}"
      DATA_DIR: /data/reports
      GLOSSARY_DB:  "/data/reports/glossary.db"
      # Tune log verbosity: debug | info | warning
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      # timeout=4 ensures the check exits cleanly within the 5s docker timeout window.
      # start_period=90s: this image imports LangChain/LangGraph/pyodbc/pandas/rdflib
      # and installs ODBC drivers — cold-start on EC2 can take 60-90s.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    dns:
      - 169.254.169.253   # AWS VPC resolver — resolves RDS/Redshift/internal hostnames
      - 8.8.8.8
    networks:
      - metadata-net

  # ── Ontology API ───────────────────────────────────────────────────────────────
  ontology-api:
    build:
      context: .
      dockerfile: Dockerfile.ontology
    image: metadata-ontology-api:latest
    container_name: metadata-ontology-api
    restart: unless-stopped
    ports:
      - "${ONTOLOGY_PORT:-8001}:8001"
    volumes:
      - reports_data:/data/reports
    environment:
      DATA_DIR: /data/reports
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Bedrock (build_node) — see aws_auth.py. ANTHROPIC_API_KEY is optional,
      # for local-dev override only.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN: "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      # RDS PostgreSQL (business_ontology.py) — see pg_secrets.py.
      APP_ENV: "${APP_ENV:-production}"
      PG_SECRET_ID: "${PG_SECRET_ID:-datananite/rds/app-user}"
      PG_HOST: "${PG_HOST:-pg-rds-datananite-dev-001a.cuepp5apko9u.us-east-1.rds.amazonaws.com}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DATABASE: "${PG_DATABASE:-datananite}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Knowledge Graph API ────────────────────────────────────────────────────────
  kg-api:
    build:
      context: .
      dockerfile: Dockerfile.kg
    image: metadata-kg-api:latest
    container_name: metadata-kg-api
    restart: unless-stopped
    ports:
      - "${KG_PORT:-8002}:8002"
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Bedrock (profile_node) + Neptune (kg_store.py graph snapshots) —
      # both authenticate via the assumed cross-account role, see aws_auth.py.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN: "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      NEPTUNE_WRITER_ENDPOINT: "${NEPTUNE_WRITER_ENDPOINT:-datananite-dev-neptune.cluster-c676y6esoazm.us-east-1.neptune.amazonaws.com}"
      NEPTUNE_READER_ENDPOINT: "${NEPTUNE_READER_ENDPOINT:-datananite-dev-neptune.cluster-ro-c676y6esoazm.us-east-1.neptune.amazonaws.com}"
      NEPTUNE_PORT: "${NEPTUNE_PORT:-8182}"
      # RDS PostgreSQL (kg_store.py source registry) — see pg_secrets.py.
      APP_ENV: "${APP_ENV:-production}"
      PG_SECRET_ID: "${PG_SECRET_ID:-datananite/rds/app-user}"
      PG_HOST: "${PG_HOST:-pg-rds-datananite-dev-001a.cuepp5apko9u.us-east-1.rds.amazonaws.com}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DATABASE: "${PG_DATABASE:-datananite}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Dialog with Data API ──────────────────────────────────────────────────
  dialog-api:
    build:
      context: .
      dockerfile: Dockerfile.dialog
    image: metadata-dialog-api:latest
    container_name: metadata-dialog-api
    restart: unless-stopped
    ports:
      - "${DIALOG_PORT:-8003}:8003"
    volumes:
      - reports_data:/data/reports
    environment:
      # Bedrock (llm_client.py assumes this role via STS — no API key needed).
      # ANTHROPIC_API_KEY is optional, for local-dev override only.
      ANTHROPIC_API_KEY:      "${ANTHROPIC_API_KEY:-}"
      AWS_REGION:             "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN:    "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      # RDS PostgreSQL (kg_registry/kg_bridges/semantic_lexicon/verified_queries
      # /metadata_store via dialog_agent/pg_store.py) — see pg_secrets.py.
      APP_ENV:                "${APP_ENV:-production}"
      PG_SECRET_ID:           "${PG_SECRET_ID:-datananite/rds/app-user}"
      PG_HOST:                "${PG_HOST:-pg-rds-datananite-dev-001a.cuepp5apko9u.us-east-1.rds.amazonaws.com}"
      PG_PORT:                "${PG_PORT:-5432}"
      PG_DATABASE:            "${PG_DATABASE:-datananite}"
      LOG_LEVEL:              "${LOG_LEVEL:-info}"
      GLOSSARY_DB:            "/data/reports/glossary.db"
      # Controls which LLM synthesize_node uses for insight generation:
      #   development → claude-haiku (cheap, fast iteration)
      #   production  → claude-sonnet (quality, default)
      DIALOG_ENV: "${DIALOG_ENV:-production}"
    healthcheck:
      # dialog-api imports LangGraph + Anthropic — allow 60s on EC2
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - metadata-net

  # ── Conformity API ────────────────────────────────────────────────────────────
  conformity-api:
    build:
      context: .
      dockerfile: Dockerfile.conformity
    image: metadata-conformity-api:latest
    container_name: metadata-conformity-api
    restart: unless-stopped
    ports:
      - "${CONFORMITY_PORT:-8004}:8004"
    environment:
      # Bedrock (llm_client.py assumes this role via STS — no API key needed).
      # ANTHROPIC_API_KEY is optional, for local-dev override only.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN: "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── DataChat Web UI (Orchestrator) ───────────────────────────────────────────
  chat-ui:
    build:
      context: .
      dockerfile: Dockerfile.chat
    image: metadata-chat-ui:latest
    container_name: metadata-chat-ui
    restart: unless-stopped
    ports:
      - "${CHAT_PORT:-8005}:8005"
    volumes:
      - metadata_catalog_data:/data
    environment:
      # Bedrock (llm_client.py assumes this role via STS — no API key needed).
      # ANTHROPIC_API_KEY is optional, for local-dev override only.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ASSUME_ROLE_ARN: "${AWS_ASSUME_ROLE_ARN:-arn:aws:iam::336756484937:role/datananite-dev-execution-role}"
      # Neptune (kg_store.py graph snapshots) — same assumed role, IAM/SigV4 auth.
      NEPTUNE_WRITER_ENDPOINT: "${NEPTUNE_WRITER_ENDPOINT:-datananite-dev-neptune.cluster-c676y6esoazm.us-east-1.neptune.amazonaws.com}"
      NEPTUNE_READER_ENDPOINT: "${NEPTUNE_READER_ENDPOINT:-datananite-dev-neptune.cluster-ro-c676y6esoazm.us-east-1.neptune.amazonaws.com}"
      NEPTUNE_PORT: "${NEPTUNE_PORT:-8182}"
      # RDS PostgreSQL — kg_store/metadata_catalog/kpi_store/glossary_registry/
      # abbrev_glossary_registry/business_ontology/access_control/session_store
      # all switch to this when APP_ENV=production (see pg_secrets.py).
      # NOTE: this also activates real access-control (RBAC) enforcement.
      APP_ENV: "${APP_ENV:-production}"
      PG_SECRET_ID: "${PG_SECRET_ID:-datananite/rds/app-user}"
      PG_HOST: "${PG_HOST:-pg-rds-datananite-dev-001a.cuepp5apko9u.us-east-1.rds.amazonaws.com}"
      PG_PORT: "${PG_PORT:-5432}"
      PG_DATABASE: "${PG_DATABASE:-datananite}"
      # Internal Docker DNS — matches service names above
      METADATA_API_URL: "http://agent-api:8000"
      ONTOLOGY_API_URL: "http://ontology-api:8001"
      KG_API_URL:       "http://kg-api:8002"
      DIALOG_API_URL:   "http://dialog-api:8003"
      SHACL_API_URL:          "http://shacl-api:8007"
      LOG_LEVEL:        "${LOG_LEVEL:-info}"
      METADATA_DB:      "/data/metadata.db"
      KG_STORE_DB:      "/data/kg_store.db"
      SEED_PASSWORD_ADITYA: "${SEED_PASSWORD_ADITYA}"
    depends_on:
      agent-api:
        condition: service_healthy
      dialog-api:
        condition: service_healthy
      ontology-api:
        condition: service_started
      kg-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  # ── Streamlit UI ──────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: metadata-agent-ui:latest
    container_name: metadata-agent-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      # Must match service names above so Docker DNS resolves them
      AGENT_API_URL:       "http://agent-api:8000"
      ONTOLOGY_API_URL:    "http://ontology-api:8001"
      KG_API_URL:          "http://kg-api:8002"
      DIALOG_API_URL:      "http://dialog-api:8003"
      CONFORMITY_API_URL:  "http://conformity-api:8004"
    depends_on:
      agent-api:
        condition: service_healthy
      ontology-api:
        condition: service_started
      kg-api:
        condition: service_started
      dialog-api:
        condition: service_started
      conformity-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - metadata-net

  # ── Tech Workforce UI ────────────────────────────────────────────────────────
  tech-ui:
    build:
      context: .
      dockerfile: Dockerfile.tech
    image: metadata-tech-ui:latest
    container_name: metadata-tech-ui
    restart: unless-stopped
    ports:
      - "${TECH_PORT:-8006}:8006"
    volumes:
      # Mount static assets live so CSS/JS changes take effect without rebuild
      - ./tech_ui:/app/tech_ui:ro
      - ./tech_ui_server.py:/app/tech_ui_server.py:ro
    environment:
      # Proxy target: the orchestrator/chat-ui service hosts all the APIs
      ORCHESTRATOR_URL: "http://chat-ui:8005"
      LOG_LEVEL:        "${LOG_LEVEL:-info}"
    depends_on:
      chat-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

  shacl-api:
    build:
      context: .
      dockerfile: Dockerfile.shacl
    container_name: metadata-shacl-api
    restart: unless-stopped
    ports:
      - "${SHACL_PORT:-8007}:8007"
    environment:
      SHACL_API_PORT: "8007"
      LOG_LEVEL:      "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metadata-net

# ── Named volume so reports persist across container restarts ─────────────────
volumes:
  reports_data:
    driver: local
  metadata_catalog_data:
    driver: local

# ── Internal network — UI reaches API via service name, not localhost ─────────
networks:
  metadata-net:
    driver: bridge
