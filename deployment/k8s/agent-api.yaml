apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: datananite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "mkdir -p /data/reports/uploads && chmod -R 777 /data/reports"]
        volumeMounts:
        - name: reports-data
          mountPath: /data/reports
      containers:
      - name: agent-api
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-agent:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        volumeMounts:
        - name: reports-data
          mountPath: /data/reports
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 10
      volumes:
      - name: reports-data
        persistentVolumeClaim:
          claimName: agent-api-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agent-api-service
  namespace: datananite
spec:
  selector:
    app: agent-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
