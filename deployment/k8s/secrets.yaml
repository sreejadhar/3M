apiVersion: v1
kind: Secret
metadata:
  name: datananite-secrets
  namespace: datananite
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "CHANGE_ME_BEFORE_APPLY"
# DO NOT apply this file directly with the placeholder value.
# Instead, run:
#   kubectl create secret generic datananite-secrets \
#     --namespace=datananite \
#     --from-literal=ANTHROPIC_API_KEY=<your-real-key> \
#     --dry-run=client -o yaml | kubectl apply -f -
