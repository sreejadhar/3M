<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataChat</title>
  <link rel="stylesheet" href="/ui/style.css" />
  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="sidebar-toggle" id="sidebarToggle" title="Close sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
      </button>
    </div>

    <div class="sidebar-section-label">Recent</div>
    <nav class="session-list" id="sessionList">
      <!-- Populated by JS -->
    </nav>
  </aside>

  <!-- ── Main area ───────────────────────────────────────────────────────── -->
  <div class="main" id="main">

    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 36 36">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#4285F4"/>
              <stop offset="50%"  stop-color="#9B72CB"/>
              <stop offset="100%" stop-color="#D96570"/>
            </linearGradient>
          </defs>
          <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" fill="url(#logoGrad)" opacity="0.9"/>
          <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
        </svg>
        <span class="logo-text">DataChat</span>
      </div>
      <div class="topbar-right">
        <div class="pipeline-status" id="pipelineStatus"></div>
      </div>
    </header>

    <!-- Chat area -->
    <div class="chat-area" id="chatArea">

      <!-- Welcome screen -->
      <div class="welcome" id="welcome">
        <div class="welcome-logo">
          <svg viewBox="0 0 80 80">
            <defs>
              <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#4285F4"/>
                <stop offset="50%"  stop-color="#9B72CB"/>
                <stop offset="100%" stop-color="#D96570"/>
              </linearGradient>
            </defs>
            <polygon points="40,4 76,22 76,58 40,76 4,58 4,22" fill="url(#wGrad)" opacity="0.9"/>
            <polygon points="40,18 62,29 62,51 40,62 18,51 18,29" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
          </svg>
        </div>
        <h1 class="welcome-title">How can I help with your data?</h1>
        <p class="welcome-sub">Upload Excel or CSV files, then ask questions in plain English.</p>

        <div class="suggestions">
          <button class="suggestion-chip" data-q="What tables are available and how many rows does each have?">
            📊 List available tables
          </button>
          <button class="suggestion-chip" data-q="Show me the top 10 rows from the first table">
            🔍 Preview data
          </button>
          <button class="suggestion-chip" data-q="What is the total headcount by department?">
            👥 Headcount by department
          </button>
          <button class="suggestion-chip" data-q="Show me the revenue breakdown by service line with percentages">
            💰 Revenue breakdown
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages"></div>

    </div><!-- /chat-area -->

    <!-- Input area -->
    <div class="input-area" id="inputArea">
      <!-- Uploaded file chips -->
      <div class="file-chips" id="fileChips"></div>

      <!-- Progress bar (shown during pipeline) -->
      <div class="pipeline-bar" id="pipelineBar" style="display:none">
        <div class="pipeline-bar-inner" id="pipelineBarInner"></div>
      </div>

      <!-- Input row -->
      <div class="input-row">
        <label class="upload-btn" for="fileInput" title="Upload CSV or Excel files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
          <input type="file" id="fileInput" multiple accept=".csv,.xlsx,.xls,.xlsm" />
        </label>

        <textarea
          class="msg-input"
          id="msgInput"
          placeholder="Ask anything about your data…"
          rows="1"
          disabled
        ></textarea>

        <button class="send-btn" id="sendBtn" disabled title="Send">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <div class="input-footer">
        DataChat can make mistakes. Verify important figures independently.
      </div>
    </div><!-- /input-area -->

  </div><!-- /main -->

  <!-- ── Toast notifications ──────────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/ui/app.js"></script>
</body>
</html>
