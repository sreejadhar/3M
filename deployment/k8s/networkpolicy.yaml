apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-services-only
  namespace: datananite2
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: datananite2
  - from:
    - ipBlock:
        cidr: 130.211.0.0/22
  - from:
    - ipBlock:
        cidr: 35.191.0.0/16
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-ui-allow-ingress
  namespace: datananite2
spec:
  podSelector:
    matchLabels:
      app: chat-ui
  policyTypes:
  - Ingress
  ingress:
  - {}
---
