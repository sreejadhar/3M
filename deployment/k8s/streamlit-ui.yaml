apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui
  namespace: datananite2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-ui
  template:
    metadata:
      labels:
        app: streamlit-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      containers:
      - name: streamlit-ui
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-ui:latest
        ports:
        - containerPort: 8502
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8502
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8502
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-ui-service
  namespace: datananite2
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: streamlit-ui
  ports:
  - port: 8502
    targetPort: 8502
  type: ClusterIP
