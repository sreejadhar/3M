apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: datananite2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      containers:
      - name: chat-ui
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-chat:latest
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        env:
        - name: SKIP_STARTUP_BRIDGE_INFERENCE
          value: "1"
        - name: SKIP_REINDEX_BRIDGE_INFERENCE
          value: "1"
        volumeMounts:
        - name: shared-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health
            port: 8005
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: datananite2-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui-service
  namespace: datananite2
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: chat-ui
  ports:
  - port: 8005
    targetPort: 8005
  type: ClusterIP
