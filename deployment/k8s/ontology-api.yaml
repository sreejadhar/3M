apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-api
  namespace: datananite2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ontology-api
  template:
    metadata:
      labels:
        app: ontology-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - datananite-pool
      containers:
      - name: ontology-api
        image: gcr.io/cog01k24f1ea555zdv7ynzthxanz5/datananite-ontology:latest
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: datananite-config
        - secretRef:
            name: datananite-secrets
        volumeMounts:
        - name: shared-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: datananite2-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-api-service
  namespace: datananite2
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: ontology-api
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
