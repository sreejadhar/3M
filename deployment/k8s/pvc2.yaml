apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datananite2-shared-pvc
  namespace: datananite2
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datananite2-unstructured-pvc
  namespace: datananite2
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
