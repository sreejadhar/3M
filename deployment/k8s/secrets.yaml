apiVersion: v1
kind: Secret
metadata:
  name: datananite-secrets
  namespace: datananite2
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "CHANGE_ME_BEFORE_APPLY"
  GCP_PROJECT_ID: "CHANGE_ME_BEFORE_APPLY"
  VERTEX_REGION: "CHANGE_ME_BEFORE_APPLY"
  JWT_SECRET: "CHANGE_ME_USE_openssl_rand_hex_32"
  SEED_PASSWORD_RIMNA: "CHANGE_ME"
  SEED_PASSWORD_IYER: "CHANGE_ME"
  SEED_PASSWORD_SENTHEESH: "CHANGE_ME"
  SEED_PASSWORD_HARPREET: "CHANGE_ME"
  SEED_PASSWORD_SUNIL: "CHANGE_ME"
  SEED_PASSWORD_SATHISH: "CHANGE_ME"
  SEED_PASSWORD_PALASH: "CHANGE_ME"
  SEED_PASSWORD_SASWATA: "CHANGE_ME"
  SEED_PASSWORD_MURUGESH: "CHANGE_ME"
  SEED_PASSWORD_JISHNU: "CHANGE_ME"
  SEED_PASSWORD_HEMANT: "CHANGE_ME"
  SEED_PASSWORD_SAMIR: "CHANGE_ME"
  SEED_PASSWORD_SOUMEN: "CHANGE_ME"
  SEED_PASSWORD_ANNAL: "CHANGE_ME"
  SEED_PASSWORD_SIVAKUMAR: "CHANGE_ME"
  SEED_PASSWORD_SREEJA: "CHANGE_ME"
  SEED_PASSWORD_SUSMITA: "CHANGE_ME"
# DO NOT apply this file directly with placeholder values.
# All values are injected via CI/CD from GitHub Actions secrets.
# CI/CD runs:
#   kubectl create secret generic datananite-secrets \
#     --namespace=datananite2 \
#     --from-literal=ANTHROPIC_API_KEY=<gcp-api-key> \
#     --from-literal=GCP_PROJECT_ID=<project-id> \
#     --from-literal=VERTEX_REGION=<region> \
#     --from-literal=JWT_SECRET=<run: openssl rand -hex 32> \
#     --from-literal=SEED_PASSWORD_RIMNA=<password> \
#     --from-literal=SEED_PASSWORD_IYER=<password> \
#     --from-literal=SEED_PASSWORD_SENTHEESH=<password> \
#     --from-literal=SEED_PASSWORD_HARPREET=<password> \
#     --from-literal=SEED_PASSWORD_SUNIL=<password> \
#     --from-literal=SEED_PASSWORD_SATHISH=<password> \
#     --from-literal=SEED_PASSWORD_PALASH=<password> \
#     --from-literal=SEED_PASSWORD_SASWATA=<password> \
#     --dry-run=client -o yaml | kubectl apply -f -
