name: Deploy DataNanite to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
    - name: SSH in, pull latest main, and redeploy via deploy.sh
      # Credentials (JWT_SECRET, SEED_PASSWORD_ADMIN, PG_USER/PG_PASSWORD,
      # etc.) live in the .env file already on the EC2 host (see
      # prerequisite.sh) — deploy.sh loads it, so nothing is injected here.
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_SSH_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script_stop: true
        script: |
          cd ~/datananite
          git fetch origin main
          git reset --hard origin/main
          ./deploy.sh

    - name: Verify deployment status
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_SSH_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/datananite
          ./deploy.sh --status
